<!DOCTYPE html>
<html>
<head>
  <title>Australian Shark Attacks</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background-color: #f5f5f5;
    }
    h1 { text-align: center; }
    #map { width: 800px; margin: auto; }
  </style>
</head>
<body>
  <h1>Australian Shark Attacks by State</h1>
  <div id="map"></div>
  <script>
    const sharkData = [
      {"id": 0, "state": "New South Wales", "attacks": 437},
      {"id": 1, "state": "Queensland", "attacks": 370},
      {"id": 2, "state": "Western Australia", "attacks": 198},
      {"id": 3, "state": "South Australia", "attacks": 73},
      {"id": 4, "state": "Victoria", "attacks": 70},
      {"id": 5, "state": "Tasmania", "attacks": 27},
      {"id": 6, "state": "Northern Territory", "attacks": 19}
    ];

    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 800,
      "height": 500,
      "title": "Australian Shark Attacks by State",
      "projection": { "type": "mercator" },
      "data": {
        "url": "https://raw.githubusercontent.com/alwaysblazing/Australia-State-TopoJson-MapChart/master/au-states-topo.json",
        "format": { "type": "topojson", "feature": "austates" }
      },
      "transform": [
        {
          "lookup": "id",
          "from": {
            "data": { "values": sharkData },
            "key": "id",
            "fields": ["state", "attacks"]
          }
        }
      ],
      "mark": { "type": "geoshape", "stroke": "white", "strokeWidth": 1 },
      "encoding": {
        "color": {
          "field": "attacks",
          "type": "quantitative",
          "title": "Number of Shark Attacks",
          "scale": { "scheme": "blues" }
        },
        "tooltip": [
          { "field": "state", "type": "nominal", "title": "State" },
          { "field": "attacks", "type": "quantitative", "title": "Attacks" }
        ]
      }
    };
    vegaEmbed('#map', spec);
  </script>
</body>
</html>
