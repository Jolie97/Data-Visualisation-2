<!DOCTYPE html>
<html>
<head>
  <title>Shark Attacks in Australia</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background-color: #f5f5f5;
    }
    h1 { text-align: center; }
    .chart-container {
      width: 800px;
      margin: 40px auto;
    }
  </style>
</head>
<body>
  <h1>Shark Attacks in Australia</h1>

  <div class="chart-container" id="map"></div>
  <div class="chart-container" id="bar_chart"></div>
  <div class="chart-container" id="lollipop"></div>

  <script>
    // ---- MAP ----
    const sharkData = [
      {"id": 0, "state": "New South Wales", "attacks": 437},
      {"id": 1, "state": "Victoria", "attacks": 70},
      {"id": 2, "state": "Queensland", "attacks": 370},
      {"id": 3, "state": "South Australia", "attacks": 73},
      {"id": 4, "state": "Western Australia", "attacks": 198},
      {"id": 5, "state": "Tasmania", "attacks": 27},
      {"id": 6, "state": "Northern Territory", "attacks": 19}
    ];

    const mapSpec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 800,
      "height": 500,
      "title": "Shark Attacks by State",
      "projection": { "type": "mercator" },
      "data": {
        "url": "https://raw.githubusercontent.com/alwaysblazing/Australia-State-TopoJson-MapChart/master/au-states-topo.json",
        "format": { "type": "topojson", "feature": "austates" }
      },
      "transform": [
        {
          "lookup": "id",
          "from": {
            "data": { "values": sharkData },
            "key": "id",
            "fields": ["state", "attacks"]
          }
        }
      ],
      "mark": { "type": "geoshape", "stroke": "white", "strokeWidth": 1 },
      "encoding": {
        "color": {
          "field": "attacks",
          "type": "quantitative",
          "title": "Number of Shark Attacks",
          "scale": { "scheme": "blues" }
        },
        "tooltip": [
          { "field": "state", "type": "nominal", "title": "State" },
          { "field": "attacks", "type": "quantitative", "title": "Attacks" }
        ]
      }
    };
    vegaEmbed('#map', mapSpec);

    // ---- STACKED BAR CHART ----
    const barData = [
      {"species": "White Shark", "type": "Non Fatal", "attacks": 270},
      {"species": "White Shark", "type": "Fatal", "attacks": 95},
      {"species": "Tiger Shark", "type": "Non Fatal", "attacks": 148},
      {"species": "Tiger Shark", "type": "Fatal", "attacks": 85},
      {"species": "Bull Shark", "type": "Non Fatal", "attacks": 133},
      {"species": "Bull Shark", "type": "Fatal", "attacks": 65},
      {"species": "All other Species", "type": "Non Fatal", "attacks": 320},
      {"species": "All other Species", "type": "Fatal", "attacks": 85}
    ];

    const barSpec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 600,
      "height": 400,
      "title": {
        "text": "Which species of shark are the most dangerous?",
        "subtitle": "Number of Fatal vs Non Fatal attacks by species",
        "fontSize": 16,
        "subtitleFontSize": 13
      },
      "data": { "values": barData },
      "mark": "bar",
      "encoding": {
        "x": {
          "field": "species",
          "type": "nominal",
          "title": null,
          "axis": { "labelAngle": 0 }
        },
        "y": {
          "field": "attacks",
          "type": "quantitative",
          "title": "Number of attacks"
        },
        "color": {
          "field": "type",
          "type": "nominal",
          "title": "Attack Type",
          "scale": {
            "domain": ["Non Fatal", "Fatal"],
            "range": ["#222222", "#f5a623"]
          }
        },
        "tooltip": [
          { "field": "species", "type": "nominal", "title": "Species" },
          { "field": "type", "type": "nominal", "title": "Type" },
          { "field": "attacks", "type": "quantitative", "title": "Attacks" }
        ]
      }
    };
    vegaEmbed('#bar_chart', barSpec);

    // ---- LOLLIPOP CHART ----
    const lolliData = [
      {"activity": "Swimming", "attacks": 451},
      {"activity": "Boarding", "attacks": 281},
      {"activity": "Snorkelling", "attacks": 127},
      {"activity": "Spearfishing", "attacks": 116},
      {"activity": "Diving", "attacks": 91},
      {"activity": "Fishing", "attacks": 37},
      {"activity": "Unmotorised Boating", "attacks": 31},
      {"activity": "Standing In Water", "attacks": 24}
    ];
  
    const lolliSpec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 600,
      "height": 350,
      "title": { "text": "What were victims doing when attacked?", "fontSize": 16 },
      "data": { "values": lolliData },
      "layer": [
        {
          "mark": { "type": "rule", "color": "#aaaaaa", "strokeWidth": 2 },
          "encoding": {
            "y": { "field": "activity", "type": "nominal", "sort": "-x", "title": null },
            "x": { "field": "attacks", "type": "quantitative" },
            "x2": { "value": 0 }
          }
        },
        {
          "mark": { "type": "point", "filled": true, "color": "#4878a8", "size": 500 },
          "encoding": {
            "y": { "field": "activity", "type": "nominal", "sort": "-x", "title": null },
            "x": { "field": "attacks", "type": "quantitative", "title": "Number of Attacks" },
            "tooltip": [
              { "field": "activity", "type": "nominal", "title": "Activity" },
              { "field": "attacks", "type": "quantitative", "title": "Attacks" }
            ]
          }
        },
        {
          "mark": { "type": "text", "color": "white", "fontSize": 11, "fontWeight": "bold" },
          "encoding": {
            "y": { "field": "activity", "type": "nominal", "sort": "-x" },
            "x": { "field": "attacks", "type": "quantitative" },
            "text": { "field": "attacks", "type": "quantitative" }
          }
        }
      ]
    };
    vegaEmbed('#lollipop', lolliSpec);
  </script>
</body>
</html>
