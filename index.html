<!DOCTYPE html>
<html>

<head>
  <title>Australian Shark Attacks</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>

  <style>
    body {
      font-family: Arial;
      margin: 40px;
      background-color: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    #map {
      width: 800px;
      margin: auto;
    }
  </style>
</head>

<body>

  <h1>Australian Shark Attacks by State</h1>

  <div id="map"></div>

  <script>

    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",

      "width": 800,
      "height": 500,

      "title": "Australian Shark Attacks by State",

      "projection": {
        "type": "mercator",
        "fit": {
          "data": {
            "url": "https://raw.githubusercontent.com/Jolie97/Data-Visualisation-2/main/australia.geojson",
            "format": { "type": "geojson" }
          }
        }
      },

      "data": {
        "url": "https://raw.githubusercontent.com/Jolie97/Data-Visualisation-2/main/australia.geojson",
        "format": {
          "type": "geojson"
        }
      },

      "transform": [
        {
          "lookup": "properties.STATE_NAME",
          "from": {
            "data": {
              "url": "shark_state.csv"
            },
            "key": "state",
            "fields": ["attacks"]
          }
        }
      ],

      "mark": {
        "type": "geoshape",
        "stroke": "white"
      },

      "encoding": {
        "color": {
          "field": "attacks",
          "type": "quantitative",
          "title": "Number of Shark Attacks",
          "scale": {
            "scheme": "blues"
          }
        },

        "tooltip": [
          {
            "field": "properties.STATE_NAME",
            "type": "nominal",
            "title": "State"
          },
          {
            "field": "attacks",
            "type": "quantitative",
            "title": "Attacks"
          }
        ]
      }
    };

    vegaEmbed('#map', spec);

  </script>

</body>
</html>
